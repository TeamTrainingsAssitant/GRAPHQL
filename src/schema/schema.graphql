"""
GraphQL-Schema des TrainingsPlanAssistant-Gateways.
Wird in den nächsten Phasen um Pläne und Übungen erweitert.
"""
type Query {
  "Lebenszeichen des Gateways"
  health: Health!

  "Der angemeldete Nutzer (GET /users/me)"
  me: User!

  "Alle Daten des angemeldeten Nutzers inklusive Pläne und Übungen (GET /users/me/export)"
  exportMyData: UserExport!

  "Alle Pläne des angemeldeten Nutzers (GET /plans)"
  plans: [Plan!]!

  "Ein Plan des angemeldeten Nutzers (GET /plans/{id})"
  plan(id: ID!): Plan!

  "Schnellsuche nach Übungsnamen, höchstens 50 Treffer (GET /exercises)"
  searchExercises(name: String = "", limit: Int = 20): [Exercise!]!

  "Übungskatalog mit Filter und Paginierung (GET /exercisedb/exercises)"
  exercises(name: String, muscles: [String!], offset: Int = 0, limit: Int = 20): ExerciseList!

  "Eine Übung mit Anleitung (GET /exercisedb/exercises/{externalId})"
  exercise(externalId: ID!): Exercise!

  "Alle Muskelgruppen des Katalogs (GET /exercisedb/muscles)"
  muscles: [String!]!

  "Alle Körperregionen des Katalogs (GET /exercisedb/bodyparts)"
  bodyParts: [String!]!
}

type Mutation {
  "Registrierung (POST /users)"
  register(input: RegisterInput!): RegisterResult!

  "Anmeldung, liefert den Bearer-Token (POST /auth)"
  login(input: LoginInput!): LoginResult!

  "Abmeldung, der Token kommt aus dem Authorization-Header (DELETE /auth)"
  logout: MessageResult!

  "Konto löschen, zur Sicherheit mit Passwort (DELETE /users/me)"
  deleteAccount(password: String!): MessageResult!

  "Plan anlegen (POST /plans)"
  createPlan(input: PlanInput!): Plan!

  "Plan ändern (PUT /plans/{id}), ersetzt Name und Beschreibung"
  updatePlan(id: ID!, input: PlanInput!): Plan!

  "Plan samt Übungen löschen (DELETE /plans/{id})"
  deletePlan(id: ID!): MessageResult!

  "Übung zu einem Plan hinzufügen (POST /plans/{id}/exercises)"
  addExerciseToPlan(planId: ID!, input: AddPlanExerciseInput!): PlanExercise!

  """
  Notiz, Gewicht, Sätze und Wiederholungen einer Übung ändern (PUT /plans/{id}/exercises/{peId}).
  Nicht angegebene Felder werden entfernt (null), wie beim REST-Endpunkt.
  """
  updatePlanExercise(
    planId: ID!
    planExerciseId: ID!
    input: UpdatePlanExerciseInput!
  ): PlanExercise!

  "Übung aus einem Plan entfernen (DELETE /plans/{id}/exercises/{peId})"
  removePlanExercise(planId: ID!, planExerciseId: ID!): MessageResult!
}

type Health {
  status: String!
  "Zeitpunkt der Antwort (ISO 8601)"
  time: String!
}

type User {
  userId: ID!
  username: String!
  email: String!
  "Datum der Registrierung (yyyy-MM-dd)"
  createdAt: String!
}

input RegisterInput {
  username: String!
  email: String!
  "mindestens 8 Zeichen"
  password: String!
}

input LoginInput {
  email: String!
  password: String!
}

type RegisterResult {
  message: String!
  userId: ID!
}

type LoginResult {
  message: String!
  token: String!
}

type MessageResult {
  message: String!
}

"Übung in einem Plan. Name, GIF und Muskeln sind aus ExerciseDB kopiert."
type PlanExercise {
  id: ID!
  externalId: String!
  name: String!
  gifUrl: String
  primaryMuscleGroups: [String!]!
  secondaryMuscleGroups: [String!]!
  position: Int!
  note: String
  "Gewicht in kg"
  weight: Float
  sets: Int
  reps: Int
}

"""
Übung aus dem Katalog. Daten: ExerciseDB (nur nicht-kommerzielle Nutzung, Quelle in der UI angeben).
bodyParts und equipments gibt es nicht bei searchExercises, instructions nur bei exercise.
"""
type Exercise {
  externalId: ID!
  name: String!
  gifUrl: String
  primaryMuscleGroups: [String!]!
  secondaryMuscleGroups: [String!]!
  bodyParts: [String!]
  equipments: [String!]
  instructions: [String!]
}

type ExerciseList {
  "Anzahl aller Treffer, unabhängig von offset und limit"
  total: Int!
  exercises: [Exercise!]!
}

"Trainingsplan. Übungen werden nur geladen, wenn sie angefragt werden."
type Plan {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  updatedAt: String!
  exerciseCount: Int!
  "Übungen in der Reihenfolge des Plans (GET /plans/{id}/exercises)"
  exercises: [PlanExercise!]!
}

input PlanInput {
  name: String!
  description: String
}

input AddPlanExerciseInput {
  "ID der Übung aus ExerciseDB"
  externalId: String!
  "höchstens 500 Zeichen"
  note: String
  "0 bis 1000 kg"
  weight: Float
  "1 bis 20"
  sets: Int
  "1 bis 100"
  reps: Int
}

input UpdatePlanExerciseInput {
  note: String
  weight: Float
  sets: Int
  reps: Int
}

"Plan mit eingebetteten Übungen, nur für den Datenexport"
type ExportedPlan {
  id: ID!
  name: String!
  description: String
  createdAt: String!
  updatedAt: String!
  exercises: [PlanExercise!]!
}

type UserExport {
  user: User!
  plans: [ExportedPlan!]!
}
